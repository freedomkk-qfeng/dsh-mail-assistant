name: Release package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked package to npm after validation
        required: true
        type: boolean
        default: false

jobs:
  pack:
    name: Check and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci
      - name: Build, test, and inspect package
        run: npm run check
      - name: Pack the exact checked commit
        run: node scripts/prepare-release.mjs
      - name: Upload package and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eduwork-dsh-mail-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error

  publish:
    name: Publish the checked artifact
    if: ${{ inputs.publish }}
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download the checked package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eduwork-dsh-mail-${{ github.sha }}
          path: release-artifact/
      - name: Verify package checksum
        working-directory: release-artifact
        run: sha256sum --check SHA256SUMS
      - name: Require successful cross-platform CI for this commit
        run: node scripts/verify-ci-run.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate stable tag
        run: node scripts/validate-release-ref.mjs
      - name: Use npm CLI with Trusted Publishing support
        run: npm install --global npm@11.6.2
      - name: Publish with npm Trusted Publishing
        run: npm publish release-artifact/*.tgz --access public
