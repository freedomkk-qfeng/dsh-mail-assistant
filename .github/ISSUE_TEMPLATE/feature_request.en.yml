name: Feature request (English)
description: Propose a bounded mail-assistant enhancement
title: "[Feature] "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: Describe the user problem rather than only a proposed API. }
    validations: { required: true }
  - type: dropdown
    id: boundary
    attributes:
      label: Capability boundary
      options: [Read-only retrieval, Explicit sending, Credentials and authentication, DSH integration, Documentation and tooling, New high-risk boundary]
    validations: { required: true }
  - type: textarea
    id: standards
    attributes: { label: Relevant mail standards, provider constraints, or DSH capability }
  - type: textarea
    id: security
    attributes: { label: Credential, message-state, approval, workspace, and compatibility impact }
    validations: { required: true }
