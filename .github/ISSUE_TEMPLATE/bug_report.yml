name: 缺陷报告
description: 报告可复现且不涉及安全漏洞的问题
title: "[Bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: 请勿包含授权码、真实地址、邮件内容、Message-ID、私有服务器或未脱敏日志。安全漏洞请按 SECURITY.md 私密报告。
  - type: input
    id: versions
    attributes:
      label: 版本
      description: dsh-mail-assistant、DSH、Node.js 和操作系统版本
    validations: { required: true }
  - type: dropdown
    id: operation
    attributes:
      label: 相关能力
      options: [设置与凭据, 目录与检索, 读取邮件, 下载附件, 发送邮件, 构建与安装]
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 最小复现以及完全脱敏的配置类型和日志
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: 预期行为 }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: 实际行为 }
    validations: { required: true }
  - type: checkboxes
    id: hygiene
    attributes:
      label: 数据检查
      options:
        - label: 我已删除授权码、真实邮件、地址、服务器、Message-ID 和个人数据。
          required: true
        - label: 这不是安全漏洞。
          required: true
