version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    allow:
      - dependency-type: development
    groups:
      mail-runtime-updates:
        patterns:
          - 'imapflow'
          - 'mailparser'
          - 'nodemailer'
          - 'schemastery'
        update-types:
          - minor
          - patch
      build-tooling-updates:
        patterns:
          - '@types/node'
          - '@types/react'
          - 'react'
          - 'tsdown'
          - 'typescript'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      - dependency-name: 'tsdown'
        update-types:
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
